name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # Backend Jobs
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Run tests
        working-directory: backend
        run: go test -v -cover ./...

      - name: Build binary
        working-directory: backend
        run: go build -o bin/api ./cmd/api

  backend-security:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check for password logging
        working-directory: backend
        run: |
          if grep -r "log\..*[Pp]assword\|fmt\.Print.*[Pp]assword" internal/ --include="*.go" | grep -v "_test.go" | grep -v "//."; then
            echo "❌ SECURITY VIOLATION: Password logging detected"
            exit 1
          fi

      - name: Run linter
        working-directory: backend
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --timeout 5m

  # Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: lubricentros/api:latest
          load: true

  # Mobile Jobs (Flutter)
  mobile-analysis:
    name: Mobile Flutter Analyze
    runs-on: ubuntu-latest
    if: false  # Flutter not available in this environment
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run analyzer
        working-directory: mobile
        run: flutter analyze
