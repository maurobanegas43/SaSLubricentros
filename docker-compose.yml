version: '3.8'

services:
  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=lubricentros
      - DB_PASSWORD=lubricentros_password
      - DB_NAME=lubricentros
      - JWT_SECRET=your_secret_key_here
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=168h
      - PORT=8080
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lubricentros-network

  # MariaDB Database
  db:
    image: mariadb:10.6
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=lubricentros
      - MYSQL_USER=lubricentros
      - MYSQL_PASSWORD=lubricentros_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/internal/database/migrations/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lubricentros-network

  # Backend for Flutter (when mobile needs to connect)
  # Uncomment when deploying to production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - api
  #   networks:
  #     - lubricentros-network

networks:
  lubricentros-network:
    driver: bridge

volumes:
  mariadb_data:
